name: Deploy

# Manual by default; flip to push-on-main once secrets are configured.
on:
  workflow_dispatch:

permissions:
  id-token: write # OIDC federated login — no stored cloud secret
  contents: read

env:
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}

jobs:
  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: What-if
        run: az deployment group what-if -g "$RESOURCE_GROUP" -f infra/main.bicep -p namePrefix=mashqbr env=prod sqlAdminLogin="${{ vars.SQL_ADMIN_LOGIN }}" sqlAdminObjectId="${{ vars.SQL_ADMIN_OBJECT_ID }}"
      - name: Deploy infrastructure
        run: az deployment group create -g "$RESOURCE_GROUP" -f infra/main.bicep -p namePrefix=mashqbr env=prod sqlAdminLogin="${{ vars.SQL_ADMIN_LOGIN }}" sqlAdminObjectId="${{ vars.SQL_ADMIN_OBJECT_ID }}"

  # One Function App serves both the API and the React SPA. deploy:build
  # produces the self-contained apps/api/deploy folder (bundled API + built
  # web in www/ + runtime node_modules), mirroring the VS Code deploy path.
  deploy:
    needs: infra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - name: Build deploy package (web + API + assemble)
        run: npm run deploy:build
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy Function App
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.FUNCTION_APP_NAME }}
          package: apps/api/deploy
          respect-funcignore: true
